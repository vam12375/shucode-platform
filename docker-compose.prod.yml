# 生产部署覆写：与 docker-compose.yml 叠加使用，服务器上不做本地构建——
# 镜像由 GitHub Actions 构建并推送到 ghcr.io（见 .github/workflows/deploy.yml）。
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 要求服务器 .env 提供 POSTGRES_PASSWORD（未设置时 compose 直接报错，避免弱口令上公网）。
# ports: !override 需要 Docker Compose v2.24+（2024-01 之后，Ubuntu 24.04+ 官方源均满足）。

x-prod-database-url: &prod-database-url
  # 容器内一律走 compose 网络，覆盖 .env 里指向 localhost 的 DATABASE_URL。
  DATABASE_URL: postgres://mendao:${POSTGRES_PASSWORD:?服务器 .env 需设置 POSTGRES_PASSWORD}@postgres:5432/mendao

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?服务器 .env 需设置 POSTGRES_PASSWORD}
    # 只绑回环：公网无法直连数据库（云防火墙也不要放行 5432）。
    ports: !override
      - "127.0.0.1:5432:5432"

  migrate:
    # 生产只拉 ghcr 镜像：清除 base 里的 build 段，否则 compose pull 会跳过该服务并提示必须先 build。
    # IMAGE_TAG 由 CI 注入 sha-<commit>，避免 latest 漂移；手动运维可显式覆盖。
    build: !reset null
    image: ghcr.io/vam12375/shucode-platform/tools:${IMAGE_TAG:-latest}
    environment:
      <<: *prod-database-url

  seed:
    build: !reset null
    image: ghcr.io/vam12375/shucode-platform/tools:${IMAGE_TAG:-latest}
    environment:
      <<: *prod-database-url

  api:
    build: !reset null
    image: ghcr.io/vam12375/shucode-platform/api:${IMAGE_TAG:-latest}
    # 生产统一由宿主 Nginx 提供 HTTPS；不能继承 base 的公网绑定而绕过入口。
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-8787}:8787"
    environment:
      <<: *prod-database-url

  gateway:
    build: !reset null
    image: ghcr.io/vam12375/shucode-platform/gateway:${IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8788}:8788"
    environment:
      <<: *prod-database-url
