# 服务编排。
#
#   整套一键启动（Postgres → 迁移 → 种子 → api → 网关）：
#     docker compose up -d            # 等价 pnpm docker:up（加 --build 显式重建镜像）
#   只起 Postgres（本地 pnpm dev 用）：docker compose up -d postgres
#
# 生产部署叠加 docker-compose.prod.yml（镜像由 GitHub Actions 推到 ghcr.io，服务器不本地构建）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 容器内地址与密钥来自 .env（env_file，不存在时跳过），DATABASE_URL / 端口在下方显式覆盖。

# .env 里的 DATABASE_URL 指向 localhost（本机开发用），容器内要访问 compose 网络里的 postgres。
x-app-env: &app-env
  DATABASE_URL: postgres://mendao:mendao@postgres:5432/mendao
  # 防止 .env 里的 MEMORY_DB=1 让容器退回内存模式。
  MEMORY_DB: ""
  # 共享限流与配置事件总线;网关不消费该变量。
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    # 本地开发与 stack 共用，数据在 mendao-pg 卷；生产建议换托管数据库。
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: mendao
      POSTGRES_PASSWORD: mendao
      POSTGRES_DB: mendao
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mendao-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mendao -d mendao"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # 一次性任务：应用 migrations/*.sql（幂等）。
  migrate:
    build: { context: ., target: tools }
    command: ["/app/migrate"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: ${TOOLS_MEMORY_LIMIT:-256m}

  # 一次性任务：种子内置配置 + 默认模型目录（幂等）；root 由控制台首次初始化创建。
  seed:
    build: { context: ., target: tools }
    command: ["/app/seed"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 128
    mem_limit: ${TOOLS_MEMORY_LIMIT:-256m}

  api:
    # 控制台产物在 api 镜像内（Dockerfile 的 console-build 阶段），以 /console 路径托管。
    build: { context: ., target: api }
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      PORT: "8787"
      CONSOLE_DIST_DIR: /app/apps/console/dist
    ports:
      # 基础编排允许设置监听地址；生产覆写强制绑定 127.0.0.1，由宿主 Nginx 回源。
      - "${API_HOST_IP:-0.0.0.0}:${API_HOST_PORT:-8787}:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${API_MEMORY_LIMIT:-512m}

  gateway:
    build: { context: ., target: gateway }
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      GATEWAY_PORT: "8788"
    ports:
      - "${GATEWAY_HOST_IP:-0.0.0.0}:${GATEWAY_HOST_PORT:-8788}:8788"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8788/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-512m}

  # 限流共享窗口与配置事件 pub/sub;应用侧 REDIS_URL 未设时自动回退进程内实现(specs/go-rewrite.md §4)。
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # 数据可再生(限流窗口/事件),不落盘不保活,故障即重建。
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

volumes:
  mendao-pg:
