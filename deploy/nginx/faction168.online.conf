# 安装到 /etc/nginx/sites-available/faction168.online。
# 前置：证书存在、两个 snippets 已安装；完整步骤见同目录 README.md。
# access log 不记录查询参数、Cookie、Authorization 或请求体。
log_format shucode_edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent rt=$request_time';

# ---- 默认站点拒绝：隐藏源站的第一道防线 ----
# 直连源站 IP 或携带陌生 SNI 的探测拿不到任何指纹（不返回证书、不返回跳转，
# HTTP 直接断开不响应），需要按域名 SNI 命中下方的正式 server 块。
# 若宿主机还承载其他站点：nginx -t 会提示 default_server 冲突，此时改为只在本配置
# 保留一个 default_server，将该需求与其他站点协调，不直接并列两个默认站点。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 = 接受 TCP 握手后立即关闭、不发送响应；ACME 挑战按 Host 命中正式站点。
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    # ssl_reject_handshake 不需要证书：TLS 层直接拒绝，扫描器拿不到 SAN/证书内容。
    # nginx >= 1.19.4 支持。
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.faction168.online console.faction168.online gw.faction168.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.faction168.online;

    ssl_certificate /etc/letsencrypt/live/faction168.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faction168.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShucodeTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/shucode-cloudflare-realip.conf;
    include /etc/nginx/snippets/shucode-gzip.conf;
    access_log /var/log/nginx/shucode-access.log shucode_edge;
    error_log /var/log/nginx/shucode-error.log warn;
    client_max_body_size 2m;

    location = / {
        return 302 /console/;
    }

    location = /console {
        return 308 /console/;
    }

    # 控制台 API 保持同源；设备授权页也在此域，复用 root 的 MFA 会话。
    location / {
        include /etc/nginx/snippets/shucode-proxy-common.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.faction168.online;

    ssl_certificate /etc/letsencrypt/live/faction168.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faction168.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShucodeTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/shucode-cloudflare-realip.conf;
    include /etc/nginx/snippets/shucode-gzip.conf;
    access_log /var/log/nginx/shucode-access.log shucode_edge;
    error_log /var/log/nginx/shucode-error.log warn;
    client_max_body_size 2m;

    # 公开 API 主机不暴露控制台。设备登录地址由 PUBLIC_APP_ORIGIN 指到 console。
    location ^~ /console {
        return 404;
    }

    location ^~ /app/ {
        return 404;
    }

    location / {
        include /etc/nginx/snippets/shucode-proxy-common.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gw.faction168.online;

    ssl_certificate /etc/letsencrypt/live/faction168.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faction168.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ShucodeTLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/shucode-cloudflare-realip.conf;
    # 网关是长连接流式响应，禁止压缩，避免首字延迟和中间缓冲。
    gzip off;
    access_log /var/log/nginx/shucode-access.log shucode_edge;
    error_log /var/log/nginx/shucode-error.log warn;
    client_max_body_size 32m;

    location / {
        include /etc/nginx/snippets/shucode-proxy-common.conf;
        proxy_pass http://127.0.0.1:8788;
    }
}
