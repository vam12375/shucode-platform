# 官网首次签发证书时使用；证书就绪后切换到 mendao.chat-site.conf。
server {
    listen 80;
    listen [::]:80;
    server_name mendao.chat www.mendao.chat;
    server_tokens off;
    include /www/server/panel/vhost/nginx/shucode/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
