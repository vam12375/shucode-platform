# 门道官网静态站点，安装到 /www/server/panel/vhost/nginx/mendao.chat-site.conf。
server {
    listen 80;
    listen [::]:80;
    server_name mendao.chat www.mendao.chat;
    server_tokens off;
    include /www/server/panel/vhost/nginx/shucode/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://mendao.chat$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mendao.chat;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/mendao.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mendao.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    include /www/server/panel/vhost/nginx/shucode/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 308 https://mendao.chat$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mendao.chat;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/mendao.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mendao.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /opt/shucode-platform/apps/site;
    index index.html;
    include /www/server/panel/vhost/nginx/shucode/gzip.conf;
    include /www/server/panel/vhost/nginx/shucode/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; img-src 'self'; media-src https://cdn.hzyaoshi.com; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    expires 5m;
    access_log off;
    error_log /www/wwwlogs/mendao-site-error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }
    # HTML 每次校验，避免发布后仍引用旧版脚本；其他静态文件沿用短缓存。
    location = /index.html {
        expires -1;
    }
    location = /favicon.ico {
        return 302 /favicon.png;
    }
    location ~ /\. {
        return 404;
    }
}
