# 安装到 /etc/nginx/snippets/shucode-gzip.conf，供 console/api 的 server 块 include。
# text/event-stream 故意不在 gzip_types 中：网关流式响应必须保持 gzip off。
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    image/svg+xml;
