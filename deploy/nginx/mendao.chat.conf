# 宝塔 Nginx：安装到 /www/server/panel/vhost/nginx/shucode.mendao.chat.conf。
# 先用 mendao.chat-http.conf 签发证书；与旧域名站点并存，独立命名日志和 TLS 缓存。
log_format mendao_edge '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name console.mendao.chat api.mendao.chat gw.mendao.chat;

    # 明文跳转由 nginx 生成，必须自己带安全头（不含 HSTS）。
    include /www/server/panel/vhost/nginx/shucode/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name console.mendao.chat;

    ssl_certificate /etc/letsencrypt/live/shucode.mendao.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shucode.mendao.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MendaoTLS:10m;
    ssl_session_tickets off;

    include /www/server/panel/vhost/nginx/shucode/gzip.conf;
    access_log /www/wwwlogs/mendao-access.log mendao_edge;
    error_log /www/wwwlogs/mendao-error.log warn;
    client_max_body_size 64m;

    # 安全头与 HSTS 由应用（securityHeaders）下发，避免 add_header 继承到代理响应造成重复 CSP。
    # 入口跳转（/ 与 /console）不再由 nginx return 出：那会短路 proxy_pass，
    # 使 Go 的 securityHeaders 中间件失效。应用已自行处理并带全套安全头。

    # 旧版 HTML 未声明 favicon，浏览器会探测 /favicon.ico；新版使用 /console/favicon.png。
    # 两个入口复用同一机器猫 PNG，让域名切换不依赖应用镜像同时升级。
    location = /favicon.ico {
        alias /opt/shucode-platform/apps/console/public/favicon.png;
        types { }
        default_type image/png;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /console/favicon.png {
        alias /opt/shucode-platform/apps/console/public/favicon.png;
        default_type image/png;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        include /www/server/panel/vhost/nginx/shucode/proxy-common.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.mendao.chat;

    ssl_certificate /etc/letsencrypt/live/shucode.mendao.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shucode.mendao.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MendaoTLS:10m;
    ssl_session_tickets off;

    include /www/server/panel/vhost/nginx/shucode/gzip.conf;
    access_log /www/wwwlogs/mendao-access.log mendao_edge;
    error_log /www/wwwlogs/mendao-error.log warn;
    client_max_body_size 64m;

    # 公开 API 主机不暴露控制台；设备登录页在 console 域名。
    # 这两个 404 由 nginx 直接生成，不经过应用，需单独补安全头（snippet 已不含 CSP）。
    location ^~ /console {
        include /www/server/panel/vhost/nginx/shucode/security-headers.conf;
        return 404;
    }

    location ^~ /app/ {
        include /www/server/panel/vhost/nginx/shucode/security-headers.conf;
        return 404;
    }

    # 官网公开宣传素材使用内容版本文件名，更新时发布新 URL。
    location ^~ /site-media/ {
        root /opt/shucode-platform/public-assets;
        try_files $uri =404;
        autoindex off;
        gzip off;
        include /www/server/panel/vhost/nginx/shucode/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        include /www/server/panel/vhost/nginx/shucode/proxy-common.conf;
        proxy_pass http://127.0.0.1:8787;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gw.mendao.chat;

    ssl_certificate /etc/letsencrypt/live/shucode.mendao.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shucode.mendao.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MendaoTLS:10m;
    ssl_session_tickets off;

    # 网关是长连接流式响应，禁止压缩和中间缓冲。
    gzip off;
    access_log /www/wwwlogs/mendao-access.log mendao_edge;
    error_log /www/wwwlogs/mendao-error.log warn;
    client_max_body_size 64m;

    location / {
        include /www/server/panel/vhost/nginx/shucode/proxy-common.conf;
        proxy_pass http://127.0.0.1:8788;
    }
}
