# 安装到 /etc/nginx/snippets/shucode-hsts.conf。
#
# 只在 443 server 块 include；80 块绝不能下发 HSTS（会污染明文响应）。
#
# ⚠️ 启用 includeSubDomains 前必须确认：该域下**每一个**子域都提供有效 HTTPS。
# 线上踩过这个坑：apex/www 解析到腾讯云 CDN 但没绑证书，返回 *.cdn.myqcloud.com，
# 而 includeSubDomains 会让浏览器把 hzyaoshi.com / www 强制升级到 HTTPS 后
# 撞上证书错误——且没有「继续访问」按钮，用户会被彻底锁死一年。
#
# 因此：
#   1. 先修好 apex/www（删掉 CDN 残留解析，或给 CDN 绑有效证书）；
#   2. 用 openssl 逐个验证所有子域；
#   3. 再把下面的 includeSubDomains 打开，并同步应用侧
#      HSTS_INCLUDE_SUBDOMAINS=true（两处必须一致，否则 nginx 与应用头互相覆盖）。
#   4. preload 是最后一步，且一旦提交无法快速撤回，确认全子域长期 HTTPS 后再加。

add_header Strict-Transport-Security "max-age=31536000" always;
