# 安装到 /etc/nginx/snippets/shucode-hsts.conf。
#
# 默认**不 include**：HSTS 由应用（securityHeaders 中间件）统一下发，
# 只在配置了 https 公开地址时发送，且值来自 HSTS_MAX_AGE / HSTS_INCLUDE_SUBDOMAINS /
# HSTS_PRELOAD 三个环境变量。
#
# 为什么不在 nginx 重复下发：
#   `add_header` 会继承到 proxy_pass 的响应上，与应用下发的 HSTS 重复。
#   HSTS 重复本身不致命（UA 取第一个），但它引入「两处配置必须永远一致」的
#   脆弱约束——改一处忘另一处就会下发两个不同 max-age，排障极难。
#
# 只有当「443 完全由 nginx 兜底、没有应用参与」时（例如纯静态站点、或应用被
# 摘除的降级入口），才在本文件所在位置 include 它。
#
# ⚠️ 启用 includeSubDomains 前必须确认：该域下**每一个**子域都提供有效 HTTPS。
# 线上踩过这个坑：apex/www 解析到 CDN 但没绑证书，返回 *.cdn.myqcloud.com，
# includeSubDomains 会让浏览器把这两个域名强制升级到 HTTPS 后撞证书错误，
# 且没有「继续访问」按钮，用户被锁死一年。
#
# 需要时把下面一行放进 443 server 块，并同步应用侧 HSTS_INCLUDE_SUBDOMAINS：

add_header Strict-Transport-Security "max-age=31536000" always;
