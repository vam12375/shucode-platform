# 已停用的三个旧入口：即使客户端缓存 DNS 或手工指定源站，也不再代理到服务。
# 不使用旧证书，也不影响 cdn.hzyaoshi.com 或同机其他站点。
server {
    listen 80;
    listen [::]:80;
    server_name console.hzyaoshi.com api.hzyaoshi.com gw.hzyaoshi.com;
    server_tokens off;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name console.hzyaoshi.com api.hzyaoshi.com gw.hzyaoshi.com;
    ssl_reject_handshake on;
}
