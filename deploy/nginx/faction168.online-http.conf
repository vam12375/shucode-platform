# 首次签证书时使用；证书签发成功后替换为 faction168.online.conf。
# 直连源站 IP 的探测同样不给指纹：默认站点直接断开。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 = 立即关闭连接；ACME 挑战按 Host 命中下方正式站点，不受影响。
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.faction168.online console.faction168.online gw.faction168.online;

    # 申请证书期间返回的 503 也应带安全头；此处不下发 HSTS（明文入口）。
    include /etc/nginx/snippets/shucode-security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 申请证书期间不通过明文入口开放登录和模型请求。
    location / {
        return 503;
    }
}
