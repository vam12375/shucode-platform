# 首次签证书时使用；证书签发成功后替换为 faction168.online.conf。
server {
    listen 80;
    listen [::]:80;
    server_name api.faction168.online console.faction168.online gw.faction168.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # 申请证书期间不通过明文入口开放登录和模型请求。
    location / {
        return 503;
    }
}
