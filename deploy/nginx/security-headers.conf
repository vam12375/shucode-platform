# 安装到 /etc/nginx/snippets/shucode-security-headers.conf。
#
# 用途：给 **nginx 自己生成的**响应补安全头。这些响应不会经过 Go 的
# securityHeaders 中间件（`return` 会短路 proxy_pass，中间件没有执行机会）。
#
# ⚠️ 只 include 在「nginx 自己出响应」的 server / location 里：
#   - 80 端口的 308 升级跳转、ACME 503 引导页、默认站点的 444；
#   - 不要 include 到 443 的代理 server 块。
# 原因：`add_header` 会继承到 proxy_pass 的响应上，与 Go 下发的同名头**重复**，
# 而重复的 CSP 是**求交**而不是覆盖——两套策略都生效、取更严的那个。
# 曾经的实际事故：nginx 侧 `default-src 'self'`（无 script-src，回落到 self）
# 与应用侧 `script-src 'self' https://challenges.cloudflare.com` 求交后，
# Turnstile 脚本被 nginx 策略拦掉，表现为登录页验证码永远出不来。
#
# 因此这里**不下发 CSP**：nginx 生成的响应都不是文档（3xx 无 body、ACME 是纯文本、
# 444 直接断连），CSP 对它们没有意义，却会给代理响应带来求交风险。
# HSTS 同理拆到 shucode-hsts.conf，只在 443 且只由应用下发。
#
# `always` 是关键：没有它 add_header 只作用于 2xx/3xx，4xx/5xx 会漏。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "no-referrer" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
