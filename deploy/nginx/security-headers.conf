# 安装到 /etc/nginx/snippets/shucode-security-headers.conf。
#
# 归位：所有「由 nginx 直接返回」的响应（3xx 跳转、错误页）必须自带安全头，
# 因为这些响应不会经过 Go 的 securityHeaders 中间件——`return` 会短路 proxy_pass，
# 中间件根本没有执行机会。线上实测过：/ 和 /console 的跳转响应此前 0 个安全头。
#
# 用法：在每个对外 server 块内 include；80 块也 include（明文跳转同样要 nosniff）。
# HSTS 不在这里——只有 443 块才允许下发，见 shucode-hsts.conf。
# `always` 是关键：没有它 add_header 只作用于 2xx/3xx，4xx/5xx 会漏。
#
# CSP 这里给的是「不依赖应用路由」的基线；应用侧对具体路径有更细的策略，
# 两者同时存在时浏览器取交集：基线比应用更严会直接挡掉应用明确允许的资源。
# 因此这里必须与 security.go 的许可保持一致——控制台有 174 处 inline style，
# 登录页还可能加载 Turnstile，缺少 style-src/img-src/frame-src 会把它们挡掉。
# 没有配置 Turnstile 时多放行该域名不会放宽应用的策略（应用侧仍会再收一次）。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "DENY"    always;
add_header Referrer-Policy        "no-referrer" always;
add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
