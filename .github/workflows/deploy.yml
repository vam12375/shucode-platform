# 生产自动部署：push 到 main → 检查 → 构建 3 个镜像推到 ghcr.io → SSH 到服务器拉取并重启。
#
# 前置条件（一次性）：
#   1. 仓库 Secrets 配置 SSH_HOST / SSH_USER / SSH_KEY（部署专用密钥对的私钥，公钥放服务器 authorized_keys），
#      以及 SSH_HOST_FINGERPRINT（服务器 host key 指纹，如 SHA256:...；强烈建议配置）。
#   2. 服务器 /opt/shucode-platform/.env 按 .env.production.example 准备好。
#   3. 服务器已 docker login ghcr.io（镜像仓库私有，需要 read:packages 权限的 PAT）。
# 服务器部署步骤详见 .env.production.example 头部注释。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑（上一个没跑完时排队而不是打断）。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # ghcr.io 的镜像命名空间 = 仓库全名（owner/repo 必须全小写）。
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # 部署按提交固定镜像，避免 latest 在构建与部署之间漂移。
  IMAGE_TAG: sha-${{ github.sha }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Go 后端(server/,specs/go-rewrite.md):与本地 server/Makefile 的容器口径同版本。
      # 钉到补丁版本:setup-go 默认优先命中 runner 工具缓存,浮动 "1.26" 会停在旧补丁
      # (1.26.9),govulncheck 因标准库 crypto/x509 漏洞(GO-2026-6809)失败。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache-dependency-path: server/go.sum
      - name: Go 检查(gofmt + vet + test)
        run: |
          cd server
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          # 全量 race 套件已超过默认 10 分钟，显式放宽避免 CI 被误杀。
          go test -race -timeout 20m ./...
      - name: Go 依赖漏洞扫描
        run: |
          cd server
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # 与 Dockerfile 的 target 一一对应：tools 供 migrate/seed 一次性任务使用。
        target: [api, gateway, tools]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # 控制台版本要显示当前提交的 tag；浅克隆拿不到 tags。
          fetch-depth: 0
      - name: 读取版本信息
        id: version
        run: |
          TAG=$(git tag --points-at HEAD --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          SUBJECT=$(git log -1 --pretty=%s)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            APP_SUBJECT=${{ steps.version.outputs.subject }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Nginx 文件只同步到项目目录，安装站点、证书与 reload 由运维按部署指南执行。
      - name: 同步 Compose 与 Nginx 部署文件到服务器
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/nginx"
          target: /opt/shucode-platform/
          overwrite: true
      - name: 拉取新镜像并重启
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE_TAG
          # 默认 command_timeout 只有 10m：首部署跨境拉 ghcr.io 镜像远超 10 分钟，会被中途掐断
          command_timeout: 120m
          script: |
            # compose 报错必须中止：没有 set -e 时后续 docker image prune 的 0 退出码会掩盖失败、job 假绿
            set -euo pipefail
            cd /opt/shucode-platform
            [ -f .env ] && chmod 600 .env
            export IMAGE_TAG="${IMAGE_TAG:?缺少 IMAGE_TAG}"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
