# 生产自动部署：push 到 main → 检查 → 构建 3 个镜像推到 ghcr.io → SSH 到服务器拉取并重启。
#
# 前置条件（一次性）：
#   1. 仓库 Secrets 配置 SSH_HOST / SSH_USER / SSH_KEY（部署专用密钥对的私钥，公钥放服务器 authorized_keys）。
#   2. 服务器 /opt/shucode-platform/.env 按 .env.production.example 准备好。
#   3. 服务器已 docker login ghcr.io（镜像仓库私有，需要 read:packages 权限的 PAT）。
# 服务器部署步骤详见 .env.production.example 头部注释。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署在跑（上一个没跑完时排队而不是打断）。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # ghcr.io 的镜像命名空间 = 仓库全名（owner/repo 必须全小写）。
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # 与 Dockerfile 的 target 一一对应：tools 供 migrate/seed 一次性任务使用。
        target: [api, gateway, tools]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.target }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 同步 compose 文件到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: /opt/shucode-platform/
          overwrite: true
      - name: 拉取新镜像并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # compose 报错必须中止：没有 set -e 时后续 docker image prune 的 0 退出码会掩盖失败、job 假绿
            set -euo pipefail
            cd /opt/shucode-platform
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
